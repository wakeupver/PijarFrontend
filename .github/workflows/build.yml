name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opsional: tanpa rahasia ini, APK rilis ditandatangani kunci debug (tetap bisa dipasang).
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  test-core:
    name: Unit test (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Siapkan Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Jalankan unit test
        run: gradle :core:test --stacktrace

      - name: Unggah laporan test bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Build APK + modul KernelSU/Magisk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Siapkan Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Siapkan keystore rilis (opsional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK debug + rilis
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Rakit paket unduhan + modul KernelSU/Magisk
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          mkdir -p dist module/system/app/Pijar
          cp "$RELEASE_APK" "dist/Pijar-v${VERSION}-release.apk"
          cp "$DEBUG_APK" "dist/Pijar-v${VERSION}-debug.apk"
          cp "$RELEASE_APK" module/system/app/Pijar/Pijar.apk
          sed -i "s/^version=.*/version=v${VERSION}/; s/^versionCode=.*/versionCode=${GITHUB_RUN_NUMBER}/" module/module.prop
          (cd module && zip -r -9 -q "../dist/Pijar-module-v${VERSION}.zip" .)
          ls -la dist

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: Pijar-build
          path: dist/*
          if-no-files-found: error

      - name: Unggah laporan build bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
          if-no-files-found: ignore

      - name: Buat GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
